name: NOVA iOS 12 Build
on:
  push:
    paths:
      - 'NOVA_iOS12_Swift_Project/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios12:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build UIKit app
        run: |
          xcodebuild -project NOVA_iOS12_Swift_Project/NOVACalculator.xcodeproj -scheme NOVACalculator -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/NOVA-Build" IPHONEOS_DEPLOYMENT_TARGET=12.0 CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/NOVA-Build/Build/Products/Release-iphoneos/NOVACalculator.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/NOVACalculator.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/NOVA-iOS12-unsigned.ipa" Payload
      - name: Package source ZIP
        run: /usr/bin/zip -qr "$GITHUB_WORKSPACE/NOVA_iOS12_Swift_Project.zip" NOVA_iOS12_Swift_Project
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-iOS12-build
          path: |
            NOVA-iOS12-unsigned.ipa
            NOVA_iOS12_Swift_Project.zip
          if-no-files-found: error
          retention-days: 14
